<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081226">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Wrong way · Noé Palego</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23173e6e'/%3E%3Ccircle cx='32' cy='32' r='15.5' fill='none' stroke='%23ff6b2c' stroke-width='8.5'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Archivo";font-style:normal;font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(/assets/archivo-variable.woff2) format("woff2")}
:root{--night:#081226;--paper:#edf0ea;--paper-2:#c3d0e1;--fire:#ff6b2c;--ember:#ffc15e;--out:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
html{height:100%;background:#173e6e}
body{min-height:100%;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(120% 90% at 50% 28%,#1d4a80 0%,#173e6e 45%,#0b1d3c 100%);color:var(--paper);font-family:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;-webkit-font-smoothing:antialiased}
main{max-width:640px}
.bot{display:block;width:132px;height:165px;margin:0 auto;overflow:visible;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
.flame{transform-origin:0 50px;transform-box:view-box;animation:flame .14s ease-in-out infinite alternate}
@keyframes flame{to{transform:scaleY(1.35)}}
.bulb{animation:bulb 1.4s ease-in-out infinite}
@keyframes bulb{50%{opacity:.35}}
.code{margin:22px 0 0;font-size:14px;font-weight:720;font-stretch:90%;letter-spacing:.18em;color:var(--fire)}
h1{margin:10px 0 0;font-size:clamp(54px,11vw,108px);font-weight:840;font-stretch:120%;letter-spacing:-.045em;line-height:.92}
p.lede{margin:20px auto 0;max-width:30ch;font-size:clamp(17px,2.2vw,20px);line-height:1.5;color:var(--paper-2)}
a{display:inline-flex;align-items:center;gap:10px;margin-top:32px;min-height:56px;padding:0 26px 0 22px;border-radius:999px;background:var(--fire);color:var(--night);font-size:16px;font-weight:700;font-stretch:96%;text-decoration:none;transition:transform .45s var(--out),background .3s}
a:hover{transform:translateY(-3px);background:var(--paper)}
a:focus-visible{outline:2px solid var(--ember);outline-offset:4px}
a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.bot,.flame,.bulb{animation:none}}
</style>
</head>
<body>
<main>
  <svg class="bot" viewBox="-60 -70 120 150" aria-hidden="true">
    <defs><radialGradient id="flameG" cx="50%" cy="15%" r="85%"><stop offset="0" stop-color="#fff4d6"/><stop offset=".35" stop-color="#ffc15e"/><stop offset=".75" stop-color="#ff6b2c"/><stop offset="1" stop-color="#ff6b2c" stop-opacity="0"/></radialGradient></defs>
    <path class="flame" d="M-11 50 Q0 96 11 50 Z" fill="url(#flameG)"/>
    <path d="M0 -44V-58" stroke="#edf0ea" stroke-width="3" stroke-linecap="round"/>
    <circle class="bulb" cx="0" cy="-61" r="5" fill="#ff6b2c"/>
    <rect x="-38" y="-46" width="76" height="56" rx="22" fill="#132a55" stroke="#edf0ea" stroke-width="3"/>
    <rect x="-28" y="-35" width="56" height="34" rx="15" fill="#06101f"/>
    <g id="eyes"><rect x="-17" y="-27" width="9" height="16" rx="4.5" fill="#ffc15e"/><rect x="8" y="-27" width="9" height="16" rx="4.5" fill="#ffc15e"/></g>
    <rect x="-46" y="-26" width="8" height="16" rx="3" fill="#ff6b2c"/><rect x="38" y="-26" width="8" height="16" rx="3" fill="#ff6b2c"/>
    <rect x="-8" y="9" width="16" height="7" fill="#edf0ea"/>
    <rect x="-28" y="15" width="56" height="37" rx="14" fill="#132a55" stroke="#edf0ea" stroke-width="3"/>
    <circle cx="0" cy="33.5" r="8" fill="none" stroke="#ff6b2c" stroke-width="4"/>
    <path d="M-28 24q-14 6-16 20" stroke="#edf0ea" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M28 24q14-8 18-24" stroke="#edf0ea" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>
  <p class="code">404</p>
  <h1>Wrong way.</h1>
  <p class="lede">This page is not on the journey. Let me take you back to the start.</p>
  <a href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Back to the journey</a>
</main>
<script>
/* the robot keeps an eye on the cursor */
(function () {
  var eyes = document.getElementById('eyes');
  addEventListener('pointermove', function (e) {
    var r = eyes.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), d = Math.hypot(dx, dy) || 1, m = Math.min(1, d / 220);
    eyes.setAttribute('transform', 'translate(' + (dx / d * 4 * m).toFixed(2) + ' ' + (dy / d * 3.5 * m).toFixed(2) + ')');
  }, { passive: true });
})();
</script>
</body>
</html>
